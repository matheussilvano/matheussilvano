name: Ask my resume

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  answer:
    if: startsWith(github.event.issue.title, 'ask:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the answer
        env:
          # Untrusted input: passed through the environment, never interpolated into a shell command.
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/answer_question.py > answer.md
      - name: Reply and close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file answer.md
          gh issue close "$ISSUE_NUMBER" --reason completed
